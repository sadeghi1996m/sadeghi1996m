# Mohammad Sadeghi's academic homepage.
# Restart Jekyll after changing this file.
locale: "en-US"
site_theme: "default"
title: "Mohammad Sadeghi"
title_separator: "|"
name: "Mohammad Sadeghi"
description: "Mohammad Sadeghi — graph signal processing, source separation, and statistical methods for sensor placement and EEG."

# Rename the GitHub repository to sadeghi1996m.github.io before publishing
# this configuration. A user homepage is served at the domain root.
url: "https://sadeghi1996m.github.io"
baseurl: ""
repository: "sadeghi1996m/sadeghi1996m.github.io"

author:
  avatar: "mohammad-sadeghi.png"
  name: "Mohammad Sadeghi"
  bio: "PhD in Signal Processing"
  location: "Grenoble, France"
  email: "m.sadeghi.gh1996@gmail.com"
  googlescholar: "https://scholar.google.com/citations?user=arn8CucAAAAJ&hl=en"
  linkedin: "mohammad-sadeghi-gh"
  # Add your GitHub profile here when your research code is ready.
  github:

breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
comments:
  provider: false
atom_feed:
  hide: true
analytics:
  provider: false
og_image: "mohammad-sadeghi.png"
social:
  type: Person
  name: "Mohammad Sadeghi"
  links:
    - "https://scholar.google.com/citations?user=arn8CucAAAAJ&hl=en"
    - "https://www.linkedin.com/in/mohammad-sadeghi-gh"

include:
  - _pages
exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yaml
  - package.json
  - package-lock.json
  - .github
  - .devcontainer
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - node_modules
  - vendor
  - local
  - scripts
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - images/themes
  - images/wiki
  - images/editing-talk.png
  - images/bio-photo.jpg
  - images/bio-photo-2.jpg
  - images/500x300.png
  - images/profile.png

encoding: "utf-8"
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      comments: false
      share: false

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Europe/Paris
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
