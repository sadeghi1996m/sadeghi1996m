name: Validate website

on:
  push:
    branches: [Deploy, master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
# Publishing is configured separately in Settings > Pages:
# Deploy from a branch > Deploy > /(root).
